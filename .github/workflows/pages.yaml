name: GitHub Pages

# Manual only: committing or pushing never deploys this site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'FerhadDev/SecondBrain-Website' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install-plugins
      - name: Privacy and project tests (isolated repository fixtures)
        run: node --test scripts/sync-obsidian.test.mjs scripts/projects-system.test.mjs scripts/validate-public-content.test.mjs
      - name: Build committed public snapshot (no vault synchronization)
        run: npm run build:pages
      - name: Validate output
        run: |
          test ! -e public/CNAME
          node scripts/validate-brain.mjs
          node scripts/validate-portfolio.mjs
          node scripts/test-portfolio-graph.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
